name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            extras: ""            # core only: adapter tests skip themselves
          - python-version: "3.12"
            extras: "[dev]"
          - python-version: "3.13"
            extras: "[dev]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".${{ matrix.extras }}"
      - name: Install provider SDKs (real event types are exercised when present)
        if: matrix.extras != ''
        run: pip install anthropic openai
      - name: Test
        run: pytest -q
      - name: Examples
        if: matrix.extras != ''
        run: |
          python examples/basic_usage.py
          python examples/advanced_usage.py
